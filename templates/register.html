<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #003366, #0055A4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow-y: auto;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(6, 131, 255, 0.2);
            width: 600px;
            max-width: 95%;
            overflow: hidden;
            transition: all 0.5s ease;
            padding: 40px;
            position: relative;
        }

        .form-container {
            width: 100%;
            position: relative;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
            font-size: 1.9em;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s ease;
            background: #f7f7f7;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0055A4;
            box-shadow: 0 0 10px rgba(0, 85, 164, 0.3);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #0055A4;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #003366;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
        }

        .toggle-link a {
            color: #0055A4;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                width: 90%;
                padding: 30px;
            }
        }
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, #02f7ff, #0077ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            width: 60%;
            max-width: 800px;
            height: 80vh;
            padding: 40px;
            background: #1e00a576;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow-y: auto;
        }
        .form-container {
            width: 600px; /* Same as register form */
            max-width: 95%;
            background:#0057ba;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            padding: 40px;
            position: relative;
            text-align: center;
            margin: auto;
        }

        h2 {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            font-size: 16px;
            color: #b0bec5;
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease-in-out;
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #00c3ff;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.6);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            transform: scale(1.05);
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: #b0bec5;
        }

        .toggle-link a {
            color: #00c3ff;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .container::-webkit-scrollbar {
            width: 8px;
        }

        .container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
        }

        .container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container" id="register-form">
        <h2>Create an Account</h2>
        <form method="post" action="/register">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <input type="tel" id="reg-phone" name="phone" placeholder="Enter your phone number" required>
            </div>
            <div class="form-group">
                <label for="reg-consumer">Consumer Number</label>
                <input type="text" id="reg-consumer" name="consumer_number" placeholder="Enter your consumer number" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="reg-address">Address</label>
                <textarea id="reg-address" name="address" placeholder="Enter your address" rows="2" required></textarea>
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" placeholder="Choose a password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="toggle-link">
            Already have an account? <a onclick="toggleForm('login')">Login</a>
        </div>
    </div>

        <!-- Login Form -->
        <div class="form-container hidden" id="login-form">
            <h2>User Login</h2>
            <form method="post" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="toggle-link">
                <a onclick="toggleForm('register')">New here? Register</a> |
                <a onclick="toggleForm('admin')">Login as Admin</a>
            </div>
        </div>
        
        <!-- Admin Login Form -->
        <div class="form-container hidden" id="admin-login-form">
            <h2>Admin Login</h2>
            <form method="post" action="/admin_login">
                <div class="form-group">
                    <label for="admin-username">Admin Username</label>
                    <input type="text" id="admin-username" name="username" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" name="password" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn">Login as Admin</button>
            </form>
            <div class="toggle-link">
                <a onclick="toggleForm('login')">Back to User Login</a>
            </div>
        </div>
        
        <script>
            function toggleForm(formType) {
                const registerForm = document.getElementById('register-form');
                const loginForm = document.getElementById('login-form');
                const adminLoginForm = document.getElementById('admin-login-form');

                if (formType === 'login') {
                    loginForm.classList.remove('hidden');
                    registerForm.classList.add('hidden');
                    adminLoginForm.classList.add('hidden');
                } else if (formType === 'register') {
                    registerForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                    adminLoginForm.classList.add('hidden');
                } else if (formType === 'admin') {
                    adminLoginForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                    registerForm.classList.add('hidden');
                }
            }

        </script>
</body>
</html>
